# Host port is 5433 because 5432 is commonly taken by a local Postgres install.
name: wear-right
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: wearright-db
    environment:
      POSTGRES_DB: wearright
      POSTGRES_USER: wearright
      POSTGRES_PASSWORD: wearright
    ports:
      - "5433:5432"
    volumes:
      - wearright_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wearright -d wearright"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wearright_pg:
