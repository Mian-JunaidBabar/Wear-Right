{% extends "emails/base.html" %}{% block content %}
<p style="margin:0 0 14px;">Hi {{ customer_name }},</p>
<p style="margin:0 0 18px;">Your order <strong>{{ order_code }}</strong> is now <strong>{{ status }}</strong>.</p>
<p style="margin:0 0 22px;">
  <a href="{{ order_url }}" style="display:inline-block;background:#C08E3E;color:#FFFFFF;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;">See my order</a>
</p>
<p style="margin:0;font-size:13px;color:#6B7280;">If you have a question, reply to this email and our team will help.</p>
{% endblock %}
