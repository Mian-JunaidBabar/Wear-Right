<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#F7F4EE;font-family:Arial,Helvetica,sans-serif;color:#1F2937;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F4EE;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E7E0D2;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px 12px;border-bottom:2px solid #C08E3E;">
                <p style="margin:0;font-size:20px;font-weight:800;letter-spacing:0.04em;color:#1F2937;">WEAR RIGHT</p>
                <p style="margin:4px 0 0;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#8A8072;">Right Style. Right You.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px;font-size:15px;line-height:1.65;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px 26px;border-top:1px solid #E7E0D2;font-size:12px;line-height:1.5;color:#8A8072;">
                <p style="margin:0;">Wear Right — personal styling for your skin tone.</p>
                <p style="margin:6px 0 0;">If you did not ask for this email, you can ignore it.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
